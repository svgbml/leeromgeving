name: Testen en deployen naar GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit-tests
        run: npm test
      - name: Moduledata controleren
        run: npm run check
      - name: Kwaliteitsrapport (blokkeert niet)
        run: npm run --silent kwaliteit >> "$GITHUB_STEP_SUMMARY"
      - name: Site bouwen
        run: npm run build
      - name: End-to-end en toegankelijkheid
        run: npx playwright install --with-deps chromium && npm run e2e
      - name: Prestatiebudget (Lighthouse)
        run: npm run lighthouse
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rapporten
          path: |
            playwright-report
            .lighthouseci
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
